# Publishes the lnl skill (SKILL.md and its bundle lnl.mjs) as GitHub release assets when a v* tag is pushed.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
      - run: npm test
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run build
      - name: Check the committed bundle is the build
        run: git diff --exit-code .claude/skills/lnl/lnl.mjs
      - run: node .claude/skills/lnl/lnl.mjs lint AGENTS.md
      - run: node .claude/skills/lnl/lnl.mjs lint .claude/skills/lnl/SKILL.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .claude/skills/lnl/SKILL.md .claude/skills/lnl/lnl.mjs --title "$GITHUB_REF_NAME" --generate-notes
